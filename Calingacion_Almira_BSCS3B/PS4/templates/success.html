<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Success</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f4f4f9 0%, #e9ecef 100%); /* Soft gradient background */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333; /* Darker text for readability */
            text-align: center;
        }
        .container {
            background-color: #ffffff; /* White background for contrast */
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            max-width: 400px; /* Limit the width for better readability */
        }
        h2 {
            color: #3943ff; /* Same blue color as the dashboard */
            margin-bottom: 20px;
        }
        a {
            text-decoration: none;
            color: #ffffff; /* White text for contrast */
            background-color: #3943ff; /* Blue background for the button */
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
            display: inline-block; /* Make the link behave like a button */
        }
        a:hover {
            background-color: #2c34b3; /* Darker blue for hover effect */
            color: #ffffff; /* Ensure text remains white on hover */
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Registration Successful!</h2>
        <a href="/login">Go to Login</a>
    </div>
</body>
</html>
